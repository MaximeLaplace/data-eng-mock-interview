<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Watercooler — Feb-March 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            color: #1a1a2e;
            background: #f8f9fa;
            line-height: 1.6;
        }
        h1 { color: #0d1117; border-bottom: 2px solid #e1e4e8; padding-bottom: 10px; }
        h2 { color: #24292f; margin-top: 2em; border-bottom: 1px solid #e1e4e8; padding-bottom: 6px; }
        h3 { color: #333; }
        table { border-collapse: collapse; width: 100%; margin: 1em 0; font-size: 14px; }
        th, td { border: 1px solid #d0d7de; padding: 8px 12px; text-align: left; }
        th { background: #f0f3f6; font-weight: 600; position: sticky; top: 0; z-index: 1; }
        tr:nth-child(even) { background: #f6f8fa; }
        tr:hover { background: #eef2f7; }
        td:first-child { white-space: nowrap; font-size: 13px; color: #666; }
        td:last-child { white-space: nowrap; text-align: center; }
        code { background: #eff1f3; padding: 2px 6px; border-radius: 3px; font-size: 13px; }
        pre { background: #1e1e1e; color: #d4d4d4; padding: 16px; border-radius: 6px; overflow-x: auto; }
        pre code { background: none; color: inherit; padding: 0; }
        blockquote {
            border-left: 4px solid #3b82f6;
            margin: 1em 0;
            padding: 12px 20px;
            background: #eff6ff;
            color: #1e3a5f;
        }
        hr { border: none; border-top: 2px solid #e1e4e8; margin: 2em 0; }
        strong { color: #0d1117; }
        a { color: #1565c0; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div id="content">Loading...</div>
    <script>
        fetch('ai-watercooler-feb-march-2026.md')
            .then(r => r.text())
            .then(md => {
                document.getElementById('content').innerHTML = marked.parse(md);
            })
            .catch(() => {
                document.getElementById('content').innerHTML = '<p>Failed to load markdown file.</p>';
            });
    </script>
</body>
</html>
